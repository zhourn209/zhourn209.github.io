<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>日历记录</title>
<style>
*{box-sizing:border-box;font-family:system-ui}
.wrap{max-width:800px;margin:20px auto;padding:16px}
.top-bar{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.mark-btn{width:32px;height:32px;background:#ff3333;border:2px solid #999;border-radius:4px;cursor:pointer}
.mark-tip{color:#444}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0}
.day{padding:10px;text-align:center;border:1px solid #ddd;border-radius:6px;cursor:pointer}
.day.marked{background:#ffcccc}
.day.active{outline:2px solid #2288ff}
.record-list{margin-top:20px}
.record-item{display:grid;grid-template-columns:80px 1fr;padding:8px;border-bottom:1px solid #eee}
.time-col{color:#333}
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <div class="mark-btn" id="markToggle"></div>
    <span class="mark-tip">标记模式：<span id="markStatus">关闭</span>（开启后点击日期会上色）</span>
  </div>
  <div class="calendar" id="calendarBox"></div>
  <h3>当日记录</h3>
  <div id="recordList" class="record-list"></div>
</div>

<script>
// 数据
let markedDays = new Set(); // 被标记的日期 '2026-11-02'
let currentViewDate = null;
let isMarkMode = false; // 是否开启标记模式，默认关闭，不自动上色

// 示例记录，结构：{date, time, content}
let records = [
  {date:"2026-11-02", time:"08:30", content:"测试记录1"},
  {date:"2026-11-02", time:"14:00", content:"测试记录2"},
  {date:"2026-11-01", time:"09:10", content:"昨天记录"}
];

const markToggle = document.getElementById('markToggle');
const markStatus = document.getElementById('markStatus');
const calendarBox = document.getElementById('calendarBox');
const recordList = document.getElementById('recordList');

// 切换标记模式
markToggle.onclick = ()=>{
  isMarkMode = !isMarkMode;
  markStatus.innerText = isMarkMode ? '开启' : '关闭';
};

// 渲染日历（简化当月）
function renderCalendar() {
  calendarBox.innerHTML = '';
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  const firstDay = new Date(y,m,1);
  const lastDay = new Date(y,m+1,0);
  for(let d=1;d<=lastDay.getDate();d++){
    const dayEl = document.createElement('div');
    dayEl.className = 'day';
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    dayEl.innerText = d;
    if(markedDays.has(dateStr)) dayEl.classList.add('marked');
    if(currentViewDate === dateStr) dayEl.classList.add('active');

    dayEl.onclick = ()=>{
      if(isMarkMode){
        // 标记模式：给日期上色
        if(markedDays.has(dateStr)) markedDays.delete(dateStr);
        else markedDays.add(dateStr);
      }else{
        // 正常模式：点击日期 → 切换查看当日记录
        currentViewDate = dateStr;
        renderRecords();
      }
      renderCalendar();
    }
    calendarBox.appendChild(dayEl);
  }
}

// 渲染记录，修复时间栏变成0的问题
function renderRecords(){
  recordList.innerHTML = '';
  if(!currentViewDate) return;
  const dayRecords = records.filter(r=>r.date === currentViewDate);
  if(dayRecords.length === 0){
    recordList.innerHTML = '<p>该日期暂无记录</p>';
    return;
  }
  dayRecords.forEach(r=>{
    const div = document.createElement('div');
    div.className = 'record-item';
    div.innerHTML = `<div class="time-col">${r.time}</div><div>${r.content}</div>`;
    recordList.appendChild(div);
  })
}

renderCalendar();
</script>
</body>
</html>
